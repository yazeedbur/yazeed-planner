<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>يومي | Yazeed</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 95px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:29px;margin:0}small,.muted{color:#94a3b8}.panel{background:#172235;border:1px solid #28374c;border-radius:20px;padding:18px;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.stat{background:#172235;border-radius:16px;padding:13px;text-align:center}.stat b{display:block;font-size:23px;color:#93c5fd}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;background:#60a5fa;color:#081322;font-weight:700;padding:12px 15px;cursor:pointer}button:active{transform:scale(.98)}button.secondary{background:#26364e;color:#e2e8f0}button.danger{background:#4a2631;color:#fecdd3}.tabs{display:flex;gap:8px;overflow:auto;margin-top:20px;padding-bottom:5px}.tabs button{white-space:nowrap;background:#26364e;color:#e2e8f0}.tabs button.active{background:#60a5fa;color:#081322}.item{background:#1e2b40;border-radius:14px;padding:13px;margin-top:10px;display:flex;align-items:center;gap:10px}.item .details{flex:1;min-width:0}.item strong{display:block;overflow-wrap:anywhere}.item p{margin:4px 0;color:#a8b8cf;font-size:13px}.item.done{opacity:.55}.item.done strong{text-decoration:line-through}.item button{padding:8px 10px}.empty{color:#94a3b8;text-align:center;padding:24px 8px}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:#cbd5e1;font-size:14px}input,select,textarea{width:100%;border:1px solid #43516a;border-radius:12px;background:#0d1728;color:white;padding:12px;min-height:45px}input[type=checkbox]{width:22px;min-height:22px;accent-color:#60a5fa}dialog{border:1px solid #43516a;border-radius:22px;background:#172235;color:white;width:min(95vw,480px);padding:20px}dialog::backdrop{background:#000b}dialog h2{margin-top:0}.actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}.top-actions{display:flex;gap:8px}#notice{font-size:13px;color:#86efac;margin-top:10px}.week{display:flex;gap:7px;overflow:auto;padding:12px 0}.week button{background:#26364e;color:#cbd5e1;min-width:55px}.week button.active{background:#60a5fa;color:#081322}footer{text-align:center;color:#64748b;font-size:12px;margin-top:26px}</style></head><body><main><header><div><small>خطط يومك بطريقتك ✨</small><h1>يومي <span style="color:#60a5fa">| Yazeed</span></h1><small id="today"></small></div><button id="addTop">+ إضافة</button></header><section class="stats"><div class="stat"><b id="total">0</b><small>مهام اليوم</small></div><div class="stat"><b id="completed">0</b><small>مكتملة</small></div><div class="stat"><b id="remaining">0</b><small>متبقية</small></div></section><nav class="tabs" id="tabs"></nav><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 id="sectionTitle" style="margin:0;font-size:20px">جدولي</h2><button class="secondary" id="addSection">+ مهمة</button></div><div id="week" class="week"></div><div id="items"></div></section><section class="panel"><strong>نسخة احتياطية</strong><p class="muted" style="font-size:13px">البيانات محفوظة في متصفحك على هذا الجهاز. احفظ نسخة احتياطية حتى لا تضيع إذا مسحت بيانات سفاري.</p><div class="top-actions"><button class="secondary" id="export">تصدير البيانات</button><button class="secondary" id="import">استيراد</button><input id="file" type="file" accept="application/json" hidden></div><div id="notice" role="status"></div></section><footer>صُنع ليكون يومك أسهل 💙</footer></main><dialog id="dialog"><form id="taskForm" class="form"><h2 id="formTitle">إضافة مهمة</h2><label>اسم المهمة<input id="name" maxlength="100" placeholder="مثال: محاضرة الفيزياء" required></label><label>القسم<select id="category"><option value="university">🎓 الجامعة</option><option value="gym">💪 النادي</option><option value="study">📚 المذاكرة</option><option value="appointment">📅 المواعيد</option><option value="other">✅ مهام أخرى</option></select></label><label>التاريخ<input id="date" type="date" required></label><label>الوقت (اختياري)<input id="time" type="time"></label><label>ملاحظات<textarea id="notes" rows="2" placeholder="تفاصيل إضافية"></textarea></label><div class="actions"><button type="button" class="secondary" id="cancel">إلغاء</button><button type="submit">حفظ المهمة</button></div></form></dialog><script>
(()=>{'use strict';const KEY='yazeed-planner-v1',cats={all:'الكل',university:'🎓 الجامعة',gym:'💪 النادي',study:'📚 المذاكرة',appointment:'📅 المواعيد',other:'✅ أخرى'};const $=id=>document.getElementById(id);const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let tasks=[],filter='all',day=localDate(),editId=null;try{let saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))tasks=saved.filter(t=>t&&typeof t.id==='string'&&typeof t.name==='string'&&typeof t.date==='string')}catch(e){$('notice').textContent='تعذر قراءة البيانات المحفوظة'}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(tasks));return true}catch(e){$('notice').textContent='تعذر الحفظ. تأكد من توفر مساحة وعدم استخدام التصفح الخاص';return false}};function el(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function render(){const today=localDate();$('today').textContent=new Intl.DateTimeFormat('ar-SA',{dateStyle:'full',calendar:'gregory'}).format(new Date());const current=tasks.filter(t=>t.date===today);$('total').textContent=current.length;$('completed').textContent=current.filter(t=>t.done).length;$('remaining').textContent=current.filter(t=>!t.done).length;$('tabs').replaceChildren();Object.entries(cats).forEach(([k,v])=>{let b=el('button',filter===k?'active':'',v);b.onclick=()=>{filter=k;render()};$('tabs').append(b)});$('sectionTitle').textContent=filter==='all'?'جدولي اليومي':cats[filter];$('week').replaceChildren();for(let n=-2;n<=5;n++){let d=new Date(today+'T12:00:00');d.setDate(d.getDate()+n);let iso=localDate(d),b=el('button',iso===day?'active':'',new Intl.DateTimeFormat('ar-SA',{weekday:'short',day:'numeric'}).format(d));b.onclick=()=>{day=iso;render()};$('week').append(b)}const list=tasks.filter(t=>t.date===day&&(filter==='all'||t.category===filter)).sort((a,b)=>(a.done-b.done)||(a.time||'99:99').localeCompare(b.time||'99:99'));$('items').replaceChildren();if(!list.length)$('items').append(el('div','empty','ما عندك مهام في هذا اليوم. اضغط + مهمة وأضف أول مهمة ✨'));for(const t of list){let box=el('div','item'+(t.done?' done':'')),check=el('input');check.type='checkbox';check.checked=!!t.done;check.setAttribute('aria-label','إكمال '+t.name);check.onchange=()=>{t.done=check.checked;save();render()};let info=el('div','details');info.append(el('strong','',t.name),el('p','',(t.time?'🕒 '+t.time+' · ':'')+(cats[t.category]||cats.other)+(t.notes?' · '+t.notes:'')));let edit=el('button','secondary','تعديل');edit.onclick=()=>open(t);let del=el('button','danger','حذف');del.onclick=()=>{if(confirm('حذف هذه المهمة؟')){tasks=tasks.filter(x=>x.id!==t.id);save();render()}};box.append(check,info,edit,del);$('items').append(box)}}function open(t){editId=t?t.id:null;$('formTitle').textContent=t?'تعديل المهمة':'إضافة مهمة';$('name').value=t?.name||'';$('category').value=t?.category||(filter==='all'?'university':filter);$('date').value=t?.date||day;$('time').value=t?.time||'';$('notes').value=t?.notes||'';$('dialog').showModal()}$('addTop').onclick=()=>open();$('addSection').onclick=()=>open();$('cancel').onclick=()=>$('dialog').close();$('taskForm').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;let t=tasks.find(x=>x.id===editId);if(!t){t={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),done:false};tasks.push(t)}Object.assign(t,{name,category:$('category').value,date:$('date').value,time:$('time').value,notes:$('notes').value.trim()});if(save()){$('dialog').close();day=t.date;render()}};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='yazeed-planner-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(t=>t&&typeof t.id==='string'&&typeof t.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&cats[t.category]))throw Error();if(!confirm('استبدال المهام الحالية بالنسخة المستوردة؟'))return;tasks=data;save();render();$('notice').textContent='تم الاستيراد بنجاح'}catch(e){$('notice').textContent='ملف النسخة الاحتياطية غير صالح'}finally{$('file').value=''}};render()})();
</script></body></html>
